site_name: DBMW Documentation
site_description: Lightweight, self-hosted, local-first database management workspace
site_author: M-Code
site_url: https://github.com/m-code/dbmw
repo_url: https://github.com/m-code/dbmw
repo_name: m-code/dbmw

docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: teal
      accent: emerald
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: emerald
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Guide:
      - Introduction: introduction.md
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Development: development.md
